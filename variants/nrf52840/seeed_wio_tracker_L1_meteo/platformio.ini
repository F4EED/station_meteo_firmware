[env:seeed_wio_tracker_L1_meteo]
custom_meshtastic_hw_model = 99
custom_meshtastic_hw_model_slug = SEEED_WIO_TRACKER_L1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = MStMet (Seeed Wio Tracker L1 Pro)
custom_meshtastic_images = wio_tracker_l1_case.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true

board = seeed_wio_tracker_L1
board_level = extra
extends = nrf52840_base
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_wio_tracker_L1_meteo
  -D SEEED_WIO_TRACKER_L1
  -D STATION_METEO
  -D STATION_METEO_VERSION=\"0.1.0\"
  -DHAS_SCREEN=0
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  -DMESHTASTIC_EXCLUDE_MQTT=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_TRACEROUTE=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1
  -DMESHTASTIC_EXCLUDE_DROPZONE=1
  -DMESHTASTIC_EXCLUDE_STATUS=1
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_GENERIC_THREAD_MODULE=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_wio_tracker_L1_meteo>
debug_tool = jlink
upload_protocol = nrfutil
